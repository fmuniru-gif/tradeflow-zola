<!doctype html>
<html lang="en-GH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset ZEZMS cache</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#f1f5f9;display:grid;place-items:center;min-height:100vh;margin:0}
main{max-width:520px;padding:24px;background:#1e293b;border-radius:16px;text-align:center}
</style>
</head>
<body>
<main>
<h1>Updating ZEZMS Sales Records and receipt printing…</h1>
<p id="status">Removing the old mobile-layout cache.</p>
</main>
<script>
(async function(){
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith('zezms-')).map(k => caches.delete(k)));
    }
    localStorage.setItem('zezms-active-build', '20260730-mobile-reference-r1');
    document.getElementById('status').textContent = 'Cache cleared. Opening ZEZMS…';
  } catch (error) {
    document.getElementById('status').textContent = 'Cache reset completed with a warning. Opening ZEZMS…';
  }
  setTimeout(function(){
    location.replace('./index.html?build=20260730-mobile-reference-r1&reset=1');
  }, 700);
}());
</script>
</body>
</html>
