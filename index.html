  function status(message,error){
    const el=document.getElementById('r53BootStatus');
    if(el){el.textContent=message;el.className=error?'err':'';}
  }
  function decodeBase64(value){
    const clean=String(value||'').replace(/\s+/g,'');
    const binary=atob(clean); const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  async function gitBlobSha1(text){
    if(!(crypto&&crypto.subtle&&window.TextEncoder)) return '';
    const body=new TextEncoder().encode(text);
    const head=new TextEncoder().encode('blob '+body.length+'\0');
    const combined=new Uint8Array(head.length+body.length);combined.set(head,0);combined.set(body,head.length);
    const digest=await crypto.subtle.digest('SHA-1',combined);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function verifyBaseline(text){
    if(!text || text.indexOf("const APP_VERSION = '3.16.1';")<0) throw new Error('The baseline APP_VERSION marker is missing.');
    if(text.indexOf('js/sync-integrity-v3161.js?v=20260823-sync-integrity-r52')<0) throw new Error('The verified r52 integrity module marker is missing.');
    const sha=await gitBlobSha1(text);
    if(sha && sha!==BASELINE_BLOB) throw new Error('Baseline integrity verification failed ('+sha+').');
    return text;
  }
  async function fetchBaseline(){
    let firstError=null;
    try{
      const response=await fetch(RAW_URL,{cache:'no-store',mode:'cors'});
      if(!response.ok) throw new Error('Raw baseline HTTP '+response.status);
      return await verifyBaseline(await response.text());
    }catch(error){firstError=error;}
    try{
      const response=await fetch(API_URL,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok) throw new Error('GitHub API baseline HTTP '+response.status);
      const data=await response.json();
      return await verifyBaseline(decodeBase64(data&&data.content));
    }catch(secondError){
      throw new Error('Could not load the verified r52 baseline. '+(firstError&&firstError.message?firstError.message+'; ':'')+(secondError.message||secondError));
    }
  }
  function patchBaseline(source){
    const marker='<script src="js/sync-integrity-v3161.js?v=20260823-sync-integrity-r52"></'+'script>';
    if(source.indexOf(marker)<0) throw new Error('Could not find the r52 integrity insertion point.');
    let output=source;
    output=output.replace('<meta name="zezms-build" content="20260823-sync-integrity-r52" />','<meta name="zezms-build" content="20260823-ledger-integrity-r53a" />');
    output=output.replace('<title>Zola Electronics Zone - TradeFlow v3.16.1 - Cross-Device Data Integrity</title>','<title>Zola Electronics Zone - TradeFlow v3.16.2 - Ledger Integrity Stabilization</title>');
    output=output.replace("const APP_VERSION = '3.16.1';","const APP_VERSION = '3.16.2';");
    output=output.replace(/TradeFlow v3\.16\.1 · Cross-Device Data Integrity/g,'TradeFlow v3.16.2 · Ledger Integrity Stabilization');
    output=output.replace(/TradeFlow PWA · v3\.16\.1 · Cross-Device Data Integrity/g,'TradeFlow PWA · v3.16.2 · Ledger Integrity Stabilization');
    const module=decodeBase64(MODULE_B64).replace(/<\/script/gi,'<\/script');
    const injected=marker+'\n<script data-zezms-ledger-integrity="'+RELEASE+'">\n'+module+'\n</'+'script>';
    output=output.replace(marker,injected);
    if(output.indexOf("const APP_VERSION = '3.16.2';")<0 || output.indexOf('data-zezms-ledger-integrity="'+RELEASE+'"')<0) throw new Error('r53A patch verification failed.');
    return output;
  }
  function renderSource(source){
    document.open(); document.write(source); document.close();
  }
  async function cachePatched(source){
    if(!('caches' in window)) return;
    const cache=await caches.open(PATCH_CACHE);
    await cache.put(PATCH_KEY,new Response(source,{headers:{'Content-Type':'text/html; charset=utf-8','X-ZEZMS-Build':RELEASE}}));
  }
  async function cachedPatched(){
    if(!('caches' in window)) return null;
    const cache=await caches.open(PATCH_CACHE);
    const response=await cache.match(PATCH_KEY);
    return response?await response.text():null;
  }
  async function boot(){
    try{
      const cached=await cachedPatched();
      if(cached && cached.indexOf('data-zezms-ledger-integrity="'+RELEASE+'"')>=0){
        status('Opening cached r53A application…'); renderSource(cached); return;
      }
      status('Verifying the immutable r52 baseline…');
      const baseline=await fetchBaseline();
      status('Applying the r53A bounded repair guard…');
      const patched=patchBaseline(baseline);
      await cachePatched(patched);
      renderSource(patched);
    }catch(error){
      console.error('ZEZMS r53A bootstrap failed',error);
      status('r53A could not start: '+(error&&error.message||error)+'. Connect this device to the Internet and reload. No business data was changed.',true);
    }
  }
  boot();
