  function decodeBase64(value){
    const clean=String(value||'').replace(/\s+/g,'');
    const binary=atob(clean); const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  async function gitBlobSha1(text){
    if(!(crypto&&crypto.subtle&&window.TextEncoder)) return '';
    const body=new TextEncoder().encode(text);
    const head=new TextEncoder().encode('blob '+body.length+'\0');
    const combined=new Uint8Array(head.length+body.length);combined.set(head,0);combined.set(body,head.length);
    const digest=await crypto.subtle.digest('SHA-1',combined);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

    const marker='<script src="js/sync-integrity-v3161.js?v=20260823-sync-integrity-r52"></'+'script>';
    if(source.indexOf(marker)<0) throw new Error('Could not find the r52 integrity insertion point.');
    let output=source;
    output=output.replace('<meta name="zezms-build" content="20260823-sync-integrity-r52" />','<meta name="zezms-build" content="20260824-receipt-integrity-r53b" />');
    output=output.replace('<title>Zola Electronics Zone - TradeFlow v3.16.1 - Cross-Device Data Integrity</title>','<title>Zola Electronics Zone - TradeFlow v3.16.2 - Receipt Integrity Stabilization</title>');
    output=output.replace("const APP_VERSION = '3.16.1';","const APP_VERSION = '3.16.2';");
    output=output.replace(/TradeFlow v3\.16\.1 · Cross-Device Data Integrity/g,'TradeFlow v3.16.2 · Receipt Integrity Stabilization');
    output=output.replace(/TradeFlow PWA · v3\.16\.1 · Cross-Device Data Integrity/g,'TradeFlow PWA · v3.16.2 · Receipt Integrity Stabilization');
    const r53a=safeInline(decodeBase64(R53A_B64));
    const r53b=safeInline(decodeBase64(R53B_B64));
    const injected=marker
      +'\n<script data-zezms-ledger-integrity="'+R53A_RELEASE+'">\n'+r53a+'\n</'+'script>'
      +'\n<script data-zezms-receipt-integrity="'+RELEASE+'">\n'+r53b+'\n</'+'script>';
    output=output.replace(marker,injected);
    if(output.indexOf("const APP_VERSION = '3.16.2';")<0 || output.indexOf('data-zezms-receipt-integrity="'+RELEASE+'"')<0 || output.indexOf('data-zezms-ledger-integrity="'+R53A_RELEASE+'"')<0) throw new Error('r53B patch verification failed.');
    return output;
  }
  function renderSource(source){ document.open(); document.write(source); document.close(); }
  async function cachePatched(source){
    if(!('caches' in window)) return;
    const cache=await caches.open(PATCH_CACHE);
    await cache.put(PATCH_KEY,new Response(source,{headers:{'Content-Type':'text/html; charset=utf-8','X-ZEZMS-Build':RELEASE}}));
  }
  async function cachedPatched(){
    if(!('caches' in window)) return null;
    const cache=await caches.open(PATCH_CACHE);
    const response=await cache.match(PATCH_KEY);
    return response?await response.text():null;
  }
  async function boot(){
    try{
      const cached=await cachedPatched();
      if(cached && cached.indexOf('data-zezms-receipt-integrity="'+RELEASE+'"')>=0){
        status('Opening cached r53B application…'); renderSource(cached); return;
      }
      status('Verifying the immutable r52 baseline…');
      const baseline=await fetchBaseline();
      status('Applying the r53A stock guard and r53B receipt-integrity guard…');
      const patched=patchBaseline(baseline);
      await cachePatched(patched);
      renderSource(patched);
    }catch(error){
      console.error('ZEZMS r53B bootstrap failed',error);
      status('r53B could not start: '+(error&&error.message||error)+'. Connect this device to the Internet and reload. No business data was changed.',true);
    }
  }
  boot();
}());
