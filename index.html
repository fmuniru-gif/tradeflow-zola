  function status(message,error){
    const el=document.getElementById('r55BootStatus');
    if(el){el.textContent=message;el.className=error?'err':'';}
  }
  function decodeBase64(value){
    const clean=String(value||'').replace(/\s+/g,'');
    const binary=atob(clean); const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  async function gitBlobSha1(text){
    if(!(crypto&&crypto.subtle&&window.TextEncoder))return '';
    const body=new TextEncoder().encode(text);
    const head=new TextEncoder().encode('blob '+body.length+'\0');
    const combined=new Uint8Array(head.length+body.length);combined.set(head,0);combined.set(body,head.length);
    const digest=await crypto.subtle.digest('SHA-1',combined);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function verifyBaseline(text){
    if(!text||text.indexOf("const APP_VERSION = '3.16.1';")<0)throw new Error('Verified baseline APP_VERSION marker is missing.');
    if(text.indexOf('js/cloud-sync.js?v=20260823-sync-integrity-r52')<0)throw new Error('Verified r52 Cloud Sync marker is missing.');
    if(text.indexOf('js/sync-integrity-v3161.js?v=20260823-sync-integrity-r52')<0)throw new Error('Verified r52 integrity marker is missing.');
    const sha=await gitBlobSha1(text);
    if(sha&&sha!==BASELINE_BLOB)throw new Error('Baseline integrity verification failed ('+sha+').');
    return text;
  }
  async function fetchBaseline(){
    let firstError=null;
    try{
      const response=await fetch(RAW_URL,{cache:'no-store',mode:'cors'});
      if(!response.ok)throw new Error('Raw baseline HTTP '+response.status);
      return await verifyBaseline(await response.text());
    }catch(error){firstError=error;}
    try{
      const response=await fetch(API_URL,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('GitHub API baseline HTTP '+response.status);
      const data=await response.json();
      return await verifyBaseline(decodeBase64(data&&data.content));
    }catch(secondError){
      throw new Error('Could not load the verified baseline. '+(firstError&&firstError.message?firstError.message+'; ':'')+(secondError.message||secondError));
    }
  }
  function safeInline(text){return String(text||'').replace(/<\/script/gi,'<\\/script');}
  function patchBaseline(source){
    const cloudMarker='<script src="js/cloud-sync.js?v=20260823-sync-integrity-r52"></'+'script>';
    const integrityMarker='<script src="js/sync-integrity-v3161.js?v=20260823-sync-integrity-r52"></'+'script>';
    const operationsMarker='<script src="js/operations-update.js?v=20260822-supplier-procurement-intelligence-r51"></'+'script>';
    const navigationMarker='<script src="js/navigation-v3101.js?v=20260822-supplier-procurement-intelligence-r51"></'+'script>';
    if(source.indexOf(cloudMarker)<0||source.indexOf(integrityMarker)<0||source.indexOf(operationsMarker)<0||source.indexOf(navigationMarker)<0)throw new Error('Could not find the verified r52/r51 script insertion points.');
    let output=source;
    output=output.replace('<meta name="zezms-build" content="20260823-sync-integrity-r52" />','<meta name="zezms-build" content="'+RELEASE+'" />');
    output=output.replace('<title>Zola Electronics Zone - TradeFlow v3.16.1 - Cross-Device Data Integrity</title>','<title>Zola Electronics Zone - TradeFlow v3.17.0 - Cash Flow & Working Capital</title>');
    output=output.replace("const APP_VERSION = '3.16.1';","const APP_VERSION = '3.17.0';");
    output=output.replace(/TradeFlow v3\.16\.1 · Cross-Device Data Integrity/g,'TradeFlow v3.17.0 · Cash Flow & Working Capital');
    output=output.replace(/TradeFlow PWA · v3\.16\.1 · Cross-Device Data Integrity/g,'TradeFlow PWA · v3.17.0 · Cash Flow & Working Capital');

    const cloud=safeInline(decodeBase64(CLOUD_B64));
    const integrity=safeInline(decodeBase64(INTEGRITY_B64));
    const notice=safeInline(decodeBase64(NOTICE_B64));
    const operations=safeInline(decodeBase64(OPERATIONS_R55_B64));
    const workingCapital=safeInline(decodeBase64(WORKING_CAPITAL_B64));

    const directCashGuard="if(action==='Deduct' && amount > (Number(DB.cashBalances[type])||0)+1e-9){";
    if((output.split(directCashGuard).length-1)!==1) throw new Error('r55 direct-cash Others guard marker mismatch.');
    output=output.replace(directCashGuard,"if(action==='Deduct' && type!=='Others' && amount > (Number(DB.cashBalances[type])||0)+1e-9){");

    output=output.replace(cloudMarker,'<script data-zezms-cloud-sync-r54>\n'+cloud+'\n</'+'script>');
    output=output.replace(integrityMarker,'<script data-zezms-sync-integrity-r54>\n'+integrity+'\n</'+'script>\n<script data-zezms-receipt-quarantine-r54>\n'+notice+'\n</'+'script>');
    output=output.replace(operationsMarker,'<script data-zezms-operations-r55>\n'+operations+'\n</'+'script>');
    output=output.replace(navigationMarker,navigationMarker+'\n<script data-zezms-working-capital-r55>\n'+workingCapital+'\n</'+'script>');
    if(output.indexOf("const APP_VERSION = '3.17.0';")<0||output.indexOf('data-zezms-cloud-sync-r54')<0||output.indexOf('data-zezms-sync-integrity-r54')<0||output.indexOf('data-zezms-operations-r55')<0||output.indexOf('data-zezms-working-capital-r55')<0||output.indexOf("type!=='Others'")<0)throw new Error('r55 patch verification failed.');
    return output;
  }
  function renderSource(source){document.open();document.write(source);document.close();}
  async function cachePatched(source){
    if(!('caches' in window))return;
    const cache=await caches.open(PATCH_CACHE);
    await cache.put(PATCH_KEY,new Response(source,{headers:{'Content-Type':'text/html; charset=utf-8','X-ZEZMS-Build':RELEASE}}));
  }
  async function cachedPatched(){
    if(!('caches' in window))return null;
    const cache=await caches.open(PATCH_CACHE);
    const response=await cache.match(PATCH_KEY);
    return response?await response.text():null;
  }
  async function boot(){
    try{
      const cached=await cachedPatched();
      if(cached&&cached.indexOf('data-zezms-working-capital-r55')>=0){
        status('Opening cached r55 application…');renderSource(cached);return;
      }
      status('Verifying the protected r52 operational baseline…');
      const baseline=await fetchBaseline();
      status('Applying Stage 6C and Others overdraft safeguards…');
      const patched=patchBaseline(baseline);
      await cachePatched(patched);
      renderSource(patched);
    }catch(error){
      console.error('ZEZMS r55 bootstrap failed',error);
      status('r55 could not start: '+(error&&error.message||error)+'. Connect this device to the Internet and reload. No business data was changed.',true);
    }
  }
  boot();
