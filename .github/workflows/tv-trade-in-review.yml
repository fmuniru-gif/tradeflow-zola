name: TV trade-in contrast review (NO DEPLOY)
on:
  push:
    branches: [feature/tv-trade-in-contrast-20261107]
concurrency:
  group: tv-trade-in-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  delivery-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact review head and complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify production baseline and review-only branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feature/tv-trade-in-contrast-20261107
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = 6d232ab4dff0695b37eb983159fcaa848a856134
          git merge-base --is-ancestor 6d232ab4dff0695b37eb983159fcaa848a856134 HEAD
          test "$(git rev-parse --is-shallow-repository)" = false
          printf 'Exact reviewed delivery commit: %s\n' "$GITHUB_SHA"
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prove trade-in handlers and business logic are unchanged
        shell: bash
        run: |
          node - <<'JS'
          const {execFileSync}=require('node:child_process'),fs=require('node:fs'),assert=require('node:assert/strict');
          const old=execFileSync('git',['show','6d232ab4dff0695b37eb983159fcaa848a856134:js/tv-trade-ins.js']).toString(),current=fs.readFileSync('js/tv-trade-ins.js','utf8');
          function stripCSS(s){assert.equal(s.split('<style>').length,2);assert.equal(s.split('</style>').length,2);return s.replace(/<style>[\s\S]*?<\/style>/,'<style>REVIEWED_FIELD_STYLES</style>').replace(/const BUILD = '20261107-tv-trade-in-r[12]'/,"const BUILD = 'REVIEWED_DELIVERY'");}
          assert.equal(stripCSS(old),stripCSS(current));console.log('PROOF_PASS: only trade-in field styles and delivery identity changed');
          JS
      - name: Install driver outside source and check generated delivery manifest
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/delivery-deps" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.0
          node tools/build-pr11-delivery.cjs --check
          node --version
          /usr/bin/google-chrome --version
          mkdir -p "$RUNNER_TEMP/delivery-home/tmp" "$RUNNER_TEMP/delivery-results"
      - name: Run source and focused contrast/upgrade browser checks
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/delivery-suites.sh" <<'SUITES'
          set -uo pipefail
          cd "$1"
          results="$2"
          node --test --test-reporter=tap --test-concurrency=1 tests/*.test.cjs 2>&1 | tee "$results/unit.log"
          unit_status=${PIPESTATUS[0]}
          node --test --test-reporter=tap --test-concurrency=1 --test-name-pattern='cached trade-in r1|Owner completes a trade-in|mobile Admin|Cashier and Manager' tests/tv-trade-ins.browser.cjs tests/pr11-cache-delivery.browser.cjs 2>&1 | tee "$results/browser.log"
          browser_status=${PIPESTATUS[0]}
          git diff --exit-code
          source_status=$?
          test -z "$(git status --porcelain)"
          clean_status=$?
          printf 'Unit/source exit: %s\nChrome browser exit: %s\nSource diff exit: %s\nClean tree exit: %s\n' \
            "$unit_status" "$browser_status" "$source_status" "$clean_status" | tee "$results/status.txt"
          test "$unit_status" -eq 0 && test "$browser_status" -eq 0 && test "$source_status" -eq 0 && test "$clean_status" -eq 0
          SUITES
          cat > "$RUNNER_TEMP/delivery-network.sh" <<'NETWORK'
          set -euo pipefail
          ip link set lo up
          ip -brief address show
          test "$(ip -o link show | wc -l)" -eq 1
          ip link show dev lo > /dev/null
          test -z "$(ip -4 route show)"
          test -z "$(ip -6 route show default)"
          echo 'ISOLATION_PASS: loopback only, no external routes or production access'
          exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs \
            env -i PATH="$3" HOME="$4" TMPDIR="$4/tmp" LANG=C.UTF-8 \
            CHROME_PATH=/usr/bin/google-chrome PLAYWRIGHT_CORE_PATH="$5" \
            /bin/bash "$6" "$7" "$8"
          NETWORK
          set +e
          sudo unshare --net -- /bin/bash "$RUNNER_TEMP/delivery-network.sh" \
            "$(id -u)" "$(id -g)" "$PATH" "$RUNNER_TEMP/delivery-home" \
            "$RUNNER_TEMP/delivery-deps/node_modules/playwright-core" "$RUNNER_TEMP/delivery-suites.sh" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/delivery-results"
          status=$?
          {
            printf '### Review-only TV trade-in workflow validation\n\nCommit: `%s`\n\n' "$GITHUB_SHA"
            for suite in unit browser; do
              printf '**%s**\n\n```text\n' "$suite"
              grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' "$RUNNER_TEMP/delivery-results/$suite.log" || true
              printf '```\n\n'
            done
            cat "$RUNNER_TEMP/delivery-results/status.txt" 2>/dev/null || true
            printf '\nCombined validation/isolation exit: %s\n' "$status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
