name: UI performance and physical count review tests (NO DEPLOY)

on:
  push:
    branches:
      - review/ui-performance-physical-count

permissions:
  contents: read

jobs:
  review-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify review branch and production base
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "review/ui-performance-physical-count"
          test "$(git rev-parse origin/main)" = "8e7dc797b3a8ca2d2ba58f3a3a2ae5879846fbc6"
          git merge-base --is-ancestor 8e7dc797b3a8ca2d2ba58f3a3a2ae5879846fbc6 HEAD

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser-test driver only
        shell: bash
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.0

      - name: Check preinstalled Chrome
        shell: bash
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version

      - name: Run entire static and unit test suite
        shell: bash
        run: node --test tests/*.test.cjs

      - name: Run entire assembled-shell Chrome browser suite
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 tests/*.browser.cjs
