name: M43 correction reconciliation PostgreSQL (NO DEPLOY)
on:
  push:
    branches: [review/m43-correction-reconciliation-r1]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact fix head and full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove standalone business and recovery bytes remain production
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = review/m43-correction-reconciliation-r1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = a3d30228cfcf2c1577209d779534164bc72452f9
          git merge-base --is-ancestor a3d30228cfcf2c1577209d779534164bc72452f9 HEAD
          git diff --exit-code cf9ff97c4f7ee9a3d65f2351ac7785fa2315bdd8 -- index.html sw.js js assets tools migrations diagnostics/m43-correction-reconciliation/coordinator.js
          test "$(git rev-parse --is-shallow-repository)" = false
          git diff --exit-code a3d30228cfcf2c1577209d779534164bc72452f9 -- js assets scripts manifest.json FORCE_UPDATE_MOBILE.html PR11_DELIVERY_UPDATE.html PR12_RAW_BYTE_UPDATE.html MAIN_RESPONSIVENESS_UPDATE.html
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare external test driver and verify delivery metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/incident-deps" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.0
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          node tools/build-pr11-delivery.cjs --check
          mkdir -p "$RUNNER_TEMP/incident-home/tmp" "$RUNNER_TEMP/incident-results"
          node --version
      - name: Run focused read-only preflight tests with loopback-only networking
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/incident-suites.sh" <<'SUITES'
          set -uo pipefail
          cd "$1"
          results="$2"
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          export PGHOST=127.0.0.1 PGPORT=55432 PGDATABASE=postgres PGUSER="$(id -un)"
          initdb -D "$HOME/pgdata" -A trust --no-locale --encoding=UTF8 > "$results/postgres-init.log" || exit 1
          pg_ctl -D "$HOME/pgdata" -o "-h 127.0.0.1 -p 55432 -k $HOME/tmp" -l "$results/postgres-server.log" start || exit 1
          trap 'pg_ctl -D "$HOME/pgdata" -m fast stop' EXIT
          export PGDATABASE=postgres
          psql -X -At -c 'SELECT version();' | tee "$results/postgres-version.log"
          node --test --test-reporter=tap tests/m43-preflight-postgres.cjs 2>&1 | tee "$results/postgres.log"
          postgres_status=${PIPESTATUS[0]}
          node --test --test-reporter=tap tests/m43-preflight.test.cjs 2>&1 | tee "$results/preflight.log"
          preflight_status=${PIPESTATUS[0]}
          node --test --test-reporter=tap tests/m43-preflight.browser.cjs 2>&1 | tee "$results/browser.log"
          browser_status=${PIPESTATUS[0]}
          git diff --exit-code
          source_status=$?
          test -z "$(git status --porcelain)"
          clean_status=$?
          printf 'SELECT-only PostgreSQL exit: %s\nPreflight exit: %s\nBrowser exit: %s\nSource diff exit: %s\nClean tree exit: %s\n' "$postgres_status" "$preflight_status" "$browser_status" "$source_status" "$clean_status" | tee "$results/status.txt"
          test "$postgres_status" -eq 0 && test "$preflight_status" -eq 0 && test "$browser_status" -eq 0 && test "$source_status" -eq 0 && test "$clean_status" -eq 0
          SUITES
          cat > "$RUNNER_TEMP/incident-network.sh" <<'NETWORK'
          set -euo pipefail
          ip link set lo up
          test "$(ip -o link show | wc -l)" -eq 1
          test -z "$(ip -4 route show)"
          test -z "$(ip -6 route show default)"
          echo 'ISOLATION_PASS: loopback only, no external routes or production access'
          exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs env -i PATH="$3" HOME="$4" TMPDIR="$4/tmp" LANG=C.UTF-8 CHROME_PATH=/usr/bin/google-chrome PLAYWRIGHT_CORE_PATH="$5" /bin/bash "$6" "$7" "$8"
          NETWORK
          set +e
          sudo unshare --net -- /bin/bash "$RUNNER_TEMP/incident-network.sh" "$(id -u)" "$(id -g)" "$PATH" "$RUNNER_TEMP/incident-home" "$RUNNER_TEMP/incident-deps/node_modules/playwright-core" "$RUNNER_TEMP/incident-suites.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/incident-results"
          status=$?
          {
            printf 'Fix review commit: `%s`\n\nApplication: `a3d30228cfcf2c1577209d779534164bc72452f9` (protected business modules unchanged)\n\n' "$GITHUB_SHA"
            printf 'Review only. No live correction reconciliation, retry, repair or deployment is authorized.\n\n'
            for suite in postgres preflight browser; do
              printf '**%s**\n\n```text\n' "$suite"
              grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' "$RUNNER_TEMP/incident-results/$suite.log" || true
              printf '```\n\n'
            done
            cat "$RUNNER_TEMP/incident-results/status.txt" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Save synthetic-only logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m43-readonly-preflight-focused
          path: ${{ runner.temp }}/incident-results
          retention-days: 14
