<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
  <title>Update ZEZMS Owner Edition</title>
  <style>
    body{font-family:system-ui;background:#0f172a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
    main{background:#1e293b;padding:24px;border-radius:16px;width:min(88vw,480px);text-align:center}
  </style>
</head>
<body>
<main><h2>Updating ZEZMS Owner Edition</h2><p>Loading the safe recovery build…</p></main>
<script>
(async()=>{
  try{
    const basePath=location.pathname.replace(/[^/]*$/,'');
    if('serviceWorker' in navigator){
      for(const registration of await navigator.serviceWorker.getRegistrations()){
        let belongs=false;
        try{belongs=new URL(registration.scope).pathname.indexOf(basePath)===0;}catch(_){belongs=false;}
        if(belongs)await registration.unregister();
      }
    }
    if('caches' in window){
      for(const key of await caches.keys()){
        if(key.startsWith('zezms-')&&!key.startsWith('zezms-commercial-pilot-'))await caches.delete(key);
      }
    }
  }catch(_){ }
  location.replace('./index.html?build=20260811-management-intelligence-r33&t='+Date.now());
})();
</script>
</body>
</html>
