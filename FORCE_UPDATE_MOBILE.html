<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
  <title>Update ZEZMS Owner Edition</title>
  <style>
    body{font-family:system-ui;background:#0f172a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
    main{background:#1e293b;padding:24px;border-radius:16px;width:min(88vw,480px);text-align:center}
  </style>
</head>
<body>
<main><h2>TradeFlow r70V update</h2><p id="status">Checking the r70V service worker...</p><p>Close every other TradeFlow tab on this device before opening the update. Keep this device's site data, IndexedDB, identity, and queue.</p><p><a id="open" href="./index.html?build=20261015-r70v-outbox-settings" style="color:#67e8f9">Open TradeFlow r70V</a></p></main>
<script>
(async()=>{
  try{
    const status=document.getElementById('status');
    const open=document.getElementById('open');
    if('serviceWorker' in navigator){
      for(const registration of await navigator.serviceWorker.getRegistrations()){
        if(!location.href.startsWith(registration.scope))continue;
        await registration.update();
        if(registration.waiting){
          status.textContent='r70V is waiting. Close all TradeFlow tabs, including this one, then reopen TradeFlow. Keep site data.';
          open.hidden=true;
          return;
        }
      }
    }
    status.textContent='Update check complete. Close other TradeFlow tabs, then open r70V in this tab.';
  }catch(error){document.getElementById('status').textContent='Update check failed. Keep this device offline and ask the Owner to verify the deployed release.';document.getElementById('open').hidden=true;}
})();
</script>
</body>
</html>
